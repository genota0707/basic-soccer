name: Deploy BASIC site and schedule

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: basic-site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate the published tabs
        if: vars.BASIC_EVENTS_CSV_URL != '' && vars.BASIC_BOOKINGS_CSV_URL != ''
        env:
          BASIC_EVENTS_CSV_URL: ${{ vars.BASIC_EVENTS_CSV_URL }}
          BASIC_BOOKINGS_CSV_URL: ${{ vars.BASIC_BOOKINGS_CSV_URL }}
        run: python3 scripts/sync_schedule.py
      - name: Prepare public files
        run: |
          mkdir _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='scripts/' \
            --exclude='_site/' --exclude='SCHEDULE-SETUP.md' \
            --exclude='.gitignore' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
